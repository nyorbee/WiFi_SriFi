<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WiFi SriFi</title>
<style>
  :root { --bg:#111418; --card:#1b2026; --line:#2b323b; --txt:#e8ecf0; --dim:#8b95a1; --acc:#ff8300; --ok:#3ddc84; --warn:#ffcc4d; --bad:#ff5a5a;
          --b24:#ffb020; --b5:#3ea6ff; --b6:#b36bff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--txt); font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:0 14px 30px; }
  header { display:flex; align-items:center; gap:10px; padding:14px 0 8px; }
  h1 { font-size:20px; margin:0; flex:1; }
  h1 span { color:var(--acc); }
  .chip { font-size:12px; padding:3px 9px; border-radius:999px; border:1px solid var(--line); color:var(--dim); }
  nav { position:sticky; top:0; z-index:5; background:var(--bg); display:flex; gap:4px; padding:6px 0 10px; }
  nav button { flex:1; padding:9px 2px; font-size:13px; border-radius:9px; background:transparent; border:1px solid var(--line); color:var(--dim); }
  nav button.on { background:var(--acc); color:#111; border-color:var(--acc); font-weight:700; }
  .tab { display:none; } .tab.on { display:block; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  label, .lbl { display:block; color:var(--dim); font-size:13px; margin-bottom:6px; }
  input[type=text], textarea { width:100%; background:#0c0f12; color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:12px; font:18px/1.3 ui-monospace,Consolas,monospace; }
  textarea { font-size:14px; min-height:120px; resize:vertical; }
  input:focus, textarea:focus { outline:2px solid var(--acc); border-color:transparent; }
  .mono { font-family:ui-monospace,Consolas,monospace; }
  .dim { color:var(--dim); font-size:13px; }
  .warn { color:var(--warn); } .bad { color:var(--bad); } .ok { color:var(--ok); }
  .row { display:flex; gap:8px; margin-top:10px; }
  button { flex:1; background:#262d35; color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:10px; font-size:15px; }
  button:active { background:#323a44; }
  button.acc { background:var(--acc); color:#111; border-color:var(--acc); font-weight:700; }
  .name { font:700 28px/1.15 system-ui,sans-serif; color:var(--ok); word-break:break-word; }
  .name.unk { color:var(--dim); font-size:20px; }
  .plus { flex:none; width:44px; height:44px; padding:0; font-size:26px; line-height:1; background:var(--acc); color:#111; border:none; vertical-align:middle; margin-left:8px; }
  .band { display:inline-block; font:800 15px/1 system-ui,sans-serif; padding:7px 11px; border-radius:8px; color:#111; letter-spacing:.3px; }
  .band.b24 { background:var(--b24); } .band.b5 { background:var(--b5); } .band.b6 { background:var(--b6); } .band.bx { background:#555; color:#eee; }
  .band.sm { font-size:12px; padding:4px 7px; border-radius:6px; }
  .bandline { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:10px 0 4px; }
  .sig { display:flex; align-items:baseline; gap:10px; margin-top:12px; }
  .pct { font:800 40px/1 system-ui,sans-serif; }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .tile { display:flex; align-items:center; gap:10px; background:#0c0f12; border:1px solid var(--line); border-left-width:4px; border-radius:12px; padding:12px; }
  .tile svg { width:34px; height:34px; flex:none; }
  .tile .tv { font:800 26px/1 system-ui,sans-serif; white-space:nowrap; }
  .tile .tv small { font-size:14px; font-weight:700; opacity:.8; margin-left:2px; }
  .tile .tl { font-size:12px; color:var(--dim); margin-top:4px; }
  .dbm { display:flex; align-items:center; gap:10px; margin-top:14px; }
  .dbm svg { width:36px; height:36px; flex:none; }
  .dbm .n { font:800 30px/1 system-ui,sans-serif; color:#4fe0d0; }
  .dbm .n small { font-size:15px; margin-left:3px; opacity:.8; }
  .dist { margin-top:16px; }
  .dist .tr { display:flex; align-items:center; gap:8px; }
  .dist .trk { flex:1; height:6px; background:#2b323b; border-radius:3px; position:relative; }
  .dist .fil { position:absolute; left:0; top:0; height:100%; background:var(--b5); border-radius:3px; }
  .dist .dot { position:absolute; top:-6px; width:18px; height:18px; margin-left:-9px; border-radius:50%; background:var(--b5); border:3px solid var(--card); }
  .dist .lb { display:flex; align-items:baseline; gap:10px; margin:6px 0 0 36px; }
  .dist .lb b { font:800 24px system-ui,sans-serif; color:var(--b5); }
  .dist .lb span { font:700 15px system-ui,sans-serif; }
  .bar { height:10px; background:#0c0f12; border-radius:6px; overflow:hidden; margin:8px 0 4px; }
  .bar > i { display:block; height:100%; border-radius:6px; }
  .bar.sm { height:6px; margin:4px 0 0; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:14px; }
  .kv .k { color:var(--dim); } .kv .v { text-align:right; font-weight:600; }
  .alert { border:1px solid var(--warn); background:rgba(255,204,77,.08); border-radius:10px; padding:10px 12px; margin:10px 0 0; font-size:14px; }
  .alert.bad { border-color:var(--bad); background:rgba(255,90,90,.08); }
  .alert button { margin-top:8px; width:100%; }
  .ap { padding:10px 0; border-bottom:1px solid var(--line); }
  .ap:last-child { border-bottom:none; }
  .ap.cur { background:rgba(61,220,132,.06); margin:0 -14px; padding:10px 14px; }
  .ap .t { display:flex; align-items:center; gap:8px; }
  .ap .n { flex:1; font-weight:700; word-break:break-word; }
  .ap .m { display:flex; align-items:center; gap:8px; margin:5px 0 3px; flex-wrap:wrap; }
  .ap .m svg { width:22px; height:22px; flex:none; }
  .ap .m .db { font:800 18px/1 system-ui,sans-serif; color:#4fe0d0; }
  .ap .m .db small { font-size:12px; margin-left:2px; opacity:.8; }
  .ap .m .ds { font:800 16px/1 system-ui,sans-serif; color:var(--b5); margin-left:6px; }
  .ap .m .dl { font-size:13px; font-weight:700; }
  .ap .p { font-weight:800; min-width:44px; text-align:right; }
  .hist { font-size:13px; font-family:ui-monospace,Consolas,monospace; color:var(--dim); line-height:1.7; }
  .seg { display:flex; gap:6px; }
  .seg button.on { background:var(--acc); color:#111; border-color:var(--acc); font-weight:700; }
  .opt { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .opt:last-child { border-bottom:none; }
  .opt .d { flex:1; } .opt .d b { display:block; font-weight:600; } .opt .d span { color:var(--dim); font-size:13px; }
  .sw { position:relative; width:52px; height:30px; flex:none; }
  .sw input { opacity:0; width:0; height:0; }
  .sw i { position:absolute; inset:0; background:#333b45; border-radius:30px; transition:.15s; }
  .sw i:before { content:""; position:absolute; width:24px; height:24px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; }
  .sw input:checked + i { background:var(--acc); }
  .sw input:checked + i:before { transform:translateX(22px); }
  table { width:100%; border-collapse:collapse; font-size:14px; margin-top:8px; }
  td, th { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:500; font-size:12px; }
  tr.hit td { color:var(--ok); font-weight:700; }
  canvas { width:100%; display:block; }
  .chb { margin:10px 0 4px; }
  .chr { display:grid; grid-template-columns:52px 1fr auto; align-items:center; gap:8px; font-size:13px; padding:3px 0; }
  .chr .c { font-weight:700; }
  .chr .bx { height:14px; background:#0c0f12; border-radius:4px; overflow:hidden; }
  .chr .bx i { display:block; height:100%; border-radius:4px; }
  .chr.me .c, .chr.me .v { color:var(--ok); }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:8px; font-size:13px; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:20; display:none; align-items:flex-end; justify-content:center; }
  .modal.on { display:flex; }
  .sheet { background:var(--card); border-top:1px solid var(--line); border-radius:16px 16px 0 0; width:100%; max-width:560px; max-height:88vh; overflow:auto; padding:16px 14px 20px; }
  .cand { display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--line); }
  .cand input { width:22px; height:22px; margin-top:2px; accent-color:var(--acc); }
  .banner { position:relative; margin:22px auto 0; max-width:360px; }
  .banner img { display:block; width:100%; height:auto; image-rendering:pixelated; }
  .banner a { position:absolute; top:0; bottom:0; width:50%; border-radius:6px; transition:background .15s; }
  .banner a.fb { left:0; } .banner a.gh { right:0; }
  .banner a:hover, .banner a:active { background:rgba(255,255,255,.14); }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title"></h1>
    <span class="chip" id="modeChip"></span>
  </header>
  <nav id="tabs">
    <button data-tab="live" data-i18n="tabLive"></button>
    <button data-tab="near" data-i18n="tabNear"></button>
    <button data-tab="chart" data-i18n="tabChart"></button>
    <button data-tab="list" data-i18n="tabList"></button>
    <button data-tab="set" data-i18n="tabSet"></button>
  </nav>

  <!-- NA ŻYWO -->
  <section class="tab" id="tab-live">
    <div id="status"></div>
    <div id="sticky"></div>
    <div class="card" id="liveCard"></div>
    <div class="card" id="speedCard"></div>
    <div class="card">
      <div class="lbl" data-i18n="roams"></div>
      <div class="hist" id="hist"></div>
    </div>
  </section>

  <!-- W POBLIŻU -->
  <section class="tab" id="tab-near">
    <div class="card">
      <div class="row" style="margin-top:0"><button class="acc" id="scanBtn" data-i18n="scanNow"></button></div>
      <div class="dim" id="scanInfo" style="margin-top:8px"></div>
    </div>
    <div class="card" id="nearList"></div>
  </section>

  <!-- WYKRES -->
  <section class="tab" id="tab-chart">
    <div class="card">
      <div class="lbl" data-i18n="chartTitle"></div>
      <canvas id="chart" height="260"></canvas>
      <div class="legend" id="legend"></div>
    </div>
    <div class="card">
      <div class="lbl" data-i18n="chTitle"></div>
      <div id="channels"></div>
    </div>
  </section>

  <!-- LISTA -->
  <section class="tab" id="tab-list">
    <div class="card">
      <label for="calcIn" data-i18n="calcLabel"></label>
      <input type="text" id="calcIn" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="9C:8C:D8:9B:2C:83">
      <div id="calcOut" style="margin-top:10px"></div>
    </div>
    <div class="card">
      <label for="list" data-i18n="listLabel"></label>
      <textarea id="list" spellcheck="false" placeholder="MikroTik sypialnia  D0:EA:11:3A:7C:1*&#10;AP-Parter-Korytarz  9C:8C:D8:A6:E4:16"></textarea>
      <div class="row native"><button id="expTxt" data-i18n="export"></button><button id="expShare" data-i18n="share"></button></div>
      <div class="row native"><button id="impTxt" data-i18n="import"></button></div>
      <div class="row"><button id="clearList" data-i18n="clear"></button></div>
      <div class="dim" id="listMsg" style="margin-top:8px"></div>
      <div id="tbl"></div>
    </div>
  </section>

  <!-- USTAWIENIA -->
  <section class="tab" id="tab-set">
    <div class="card">
      <div class="lbl" data-i18n="mode"></div>
      <div class="seg" id="modeSeg"><button data-v="universal" data-i18n="modeUni"></button><button data-v="aruba">Aruba</button></div>
      <div class="dim" id="modeDesc" style="margin-top:8px"></div>
    </div>
    <div class="card">
      <div class="opt"><div class="d"><b data-i18n="optSound"></b><span data-i18n="optSoundD"></span></div>
        <button id="testSound" style="flex:none;width:auto;padding:8px 12px" data-i18n="test"></button>
        <label class="sw"><input type="checkbox" id="optSound"><i></i></label></div>
      <div class="opt"><div class="d"><b data-i18n="optVib"></b><span data-i18n="optVibD"></span></div>
        <label class="sw"><input type="checkbox" id="optVib"><i></i></label></div>
      <div class="opt"><div class="d"><b data-i18n="optScreen"></b><span data-i18n="optScreenD"></span></div>
        <label class="sw"><input type="checkbox" id="optScreen"><i></i></label></div>
      <div class="opt native"><div class="d"><b data-i18n="optBg"></b><span data-i18n="optBgD"></span></div>
        <label class="sw"><input type="checkbox" id="optBg"><i></i></label></div>
      <div class="opt"><div class="d"><b data-i18n="optSticky"></b><span data-i18n="optStickyD"></span></div>
        <label class="sw"><input type="checkbox" id="optSticky"><i></i></label></div>
    </div>
    <div class="card">
      <div class="lbl" data-i18n="lang"></div>
      <div class="seg" id="langSeg"><button data-v="pl">Polski</button><button data-v="en">English</button></div>
    </div>
    <div class="card dim native"><b style="color:var(--txt)" data-i18n="tileT"></b><br><span data-i18n="tileD"></span></div>
    <div class="card dim" id="about"></div>
  </section>

  <div class="banner">
    <img src="created.png" alt="Created by IT Guy">
    <a class="fb" href="https://www.facebook.com/ajtiguy" aria-label="Facebook"></a>
    <a class="gh" href="https://github.com/nyorbee" aria-label="GitHub"></a>
  </div>
</main>

<!-- okno nazywania AP -->
<div class="modal" id="nameModal">
  <div class="sheet">
    <div style="font:700 19px system-ui;margin-bottom:10px" data-i18n="nameTitle"></div>
    <div id="nmInfo" class="dim" style="margin-bottom:10px"></div>
    <input type="text" id="nmName" autocomplete="off" style="font-family:system-ui;font-size:18px">
    <div id="nmCands" style="margin-top:12px"></div>
    <div class="row"><button class="acc" id="nmSave" data-i18n="save"></button><button id="nmCancel" data-i18n="cancel"></button></div>
  </div>
</div>

<script src="oui.js"></script>

const APP_NAME = 'WiFi SriFi';   // ta sama nazwa co pod ikoną (res/values/strings.xml)
const $ = id => document.getElementById(id);
const A = window.Android || null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const hex = (n, len) => n.toString(16).toUpperCase().padStart(len, '0');
const pairs = s => s.match(/.{1,2}/g).join(':');
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

let S = { mode:'universal', sound:true, vib:true, screen:false, bg:false, sticky:false, lang:(navigator.language || 'pl').toLowerCase().startsWith('pl') ? 'pl' : 'en' };
try { Object.assign(S, JSON.parse(lsGet('apidSettings', '{}'))); } catch (e) {}
const saveSettings = () => { lsSet('apidSettings', JSON.stringify(S)); syncNative(); };
function syncNative() {
  if (!A || !A.syncState) return;
  try { A.syncState(lsGet('apList', ''), JSON.stringify({ mode: S.mode, lang: S.lang, sound: S.sound, vib: S.vib, sticky: S.sticky })); } catch (e) {}
}

function t(k, v) {
  let s = (I18N[S.lang] && I18N[S.lang][k]) || I18N.pl[k] || k;
  if (v) for (const x in v) s = s.split('{' + x + '}').join(v[x]);
  return s;
}

/* BSSID / MAC: 12 cyfr hex albo null */
function norm(s) {
  const h = String(s || '').replace(/[^0-9a-f]/gi, '').toUpperCase();
  return h.length === 12 ? h : null;
}
function bandOf(f) { return f >= 2400 && f < 2500 ? '24' : f >= 4900 && f < 5900 ? '5' : f >= 5925 && f < 7200 ? '6' : null; }
function chanOf(f) { return f >= 2412 && f <= 2472 ? (f - 2407) / 5 : f === 2484 ? 14 : f >= 5000 && f < 5900 ? (f - 5000) / 5 : f >= 5955 ? (f - 5950) / 5 : '?'; }
function bandBadge(b, sm) {
  const txt = b === '24' ? '2,4 GHz' : b === '5' ? '5 GHz' : b === '6' ? '6 GHz' : '?';
  return `<span class="band ${sm ? 'sm ' : ''}${b ? 'b' + b : 'bx'}">${S.lang === 'en' ? txt.replace(',', '.') : txt}</span>`;
}
function pctOf(rssi) { return clamp(Math.round(2 * (rssi + 100)), 0, 100); }
function qual(p) { return p >= 80 ? ['excellent', 'var(--ok)'] : p >= 60 ? ['good', '#a6e05a'] : p >= 40 ? ['fair', 'var(--warn)'] : ['poor', 'var(--bad)']; }
function distM(rssi, f) { return Math.pow(10, (27.55 - 20 * Math.log10(f) + Math.abs(rssi)) / 20); }
function distParts(d) { const n = d < 10 ? d.toFixed(1) : String(Math.round(d)); return d < 1 ? ['< 1', 'm'] : [S.lang === 'pl' ? n.replace('.', ',') : n, 'm']; }
function distTxt(d) { const n = d < 10 ? d.toFixed(1) : String(Math.round(d)); return d < 1 ? '< 1 m' : (S.lang === 'pl' ? n.replace('.', ',') : n) + ' m'; }
function speedTxt(x) { return x > 0 ? x + ' Mb/s' : '–'; }

/* ---------- ikony ---------- */

  return `<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M2 8.5a15 15 0 0 1 20 0" stroke="${a(3)}"/><path d="M5.2 12a10.5 10.5 0 0 1 13.6 0" stroke="${a(2)}"/><path d="M8.5 15.5a5 5 0 0 1 7 0" stroke="${a(1)}"/><circle cx="12" cy="19" r="1.6" fill="${c}" stroke="none"/></svg>`; };
const ICON_ROUTER = `<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#3ea6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 16.5h.01M11 16.5h.01M15 13l2-6M8.5 7.5a6 6 0 0 1 8.5-2.2M10.5 9.5a3 3 0 0 1 4.3-1.1"/></svg>`;
function sigLevel(p) { return p >= 75 ? [3, '#4fe0d0'] : p >= 45 ? [2, '#ff9f1a'] : [1, '#ff5a5a']; }
function distLabel(d) { return d < 1 ? t('dl1') : d < 3 ? t('dl2') : d < 10 ? t('dl3') : d < 25 ? t('dl4') : t('dl5'); }
function distPos(d) { return clamp((Math.log10(clamp(d, 0.5, 50)) - Math.log10(0.5)) / 2, 0, 1) * 100; }
const ICON_SIG = c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round"><path d="M2 8.5a15 15 0 0 1 20 0"/><path d="M5 12a10 10 0 0 1 14 0"/><path d="M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1.4" fill="${c}"/></svg>`;
const ICON_DIST = c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6-5.6-6-10.5a6 6 0 0 1 12 0C18 15.4 12 21 12 21z"/><circle cx="12" cy="10.5" r="2.2"/></svg>`;
const ICON_KEY = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="vertical-align:-3px;margin-right:4px"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/></svg>`;

function phoneKind() {
  const m = ((st.maker || '') + ' ' + (st.brand || '')).toLowerCase();
  return /xiaomi|redmi|poco/.test(m) ? 'xiaomi' : /samsung/.test(m) ? 'samsung' : /google|motorola|nokia|hmd/.test(m) ? 'google'
       : /oneplus|oppo|realme/.test(m) ? 'oplus' : /huawei|honor/.test(m) ? 'huawei' : 'other';
}
function macHowTo() { const k = phoneKind(); return MAC_HOWTO[k][S.lang] || MAC_HOWTO[k].pl; }
function pwHowTo() { const k = phoneKind(); return PW_HOWTO[k][S.lang] || PW_HOWTO[k].pl; }

/* ---------- producent z OUI ---------- */
let OUI = null;
function vendorOf(h) {
  if (!h) return '';
  if (!OUI) {
    OUI = new Map();
    if (window.OUI_RAW) for (const e of OUI_RAW.split(';')) OUI.set(e.slice(0, 6), parseInt(e.slice(6), 16));
  }
  const look = p => OUI.has(p) ? OUI_NAMES[OUI.get(p)] : null;
  const b0 = parseInt(h.slice(0, 2), 16);
  if (b0 & 2) {                          // bit "lokalnie administrowany" = adres wirtualny
    const base = look(hex(b0 & ~2, 2) + h.slice(2, 6));
    return base ? t('vendorProb', { v: base }) + ' · ' + t('vendorLocal') : t('vendorLocal');
  }
  return look(h.slice(0, 6)) || t('vendorUnknown');
}

/* =========================================================
   Lista AP
   linie:  "Nazwa  9C:8C:D8:A1:B2:C8"   -> MAC urządzenia (Aruba) albo dokładny BSSID
           "Nazwa  D0:EA:11:3A:7C:1*"   -> wszystkie BSSID-y z tym początkiem (jedno radio)
           "?" w miejscu cyfry          -> cyfra nieznana (MAC wyliczony z BSSID Aruby)
   ========================================================= */
const RE_ADDR = /(?<![0-9a-f])(?:[0-9a-f?]{2}[:\-.]?){5}(?:[0-9a-f?]{2}|[0-9a-f]\*)(?![0-9a-f])/i;
let aps = [];
function parseList(text) {
  const out = [];
  for (const line of String(text).split(/\r?\n/)) {
    const m = line.match(RE_ADDR);
    if (!m) continue;
    const tok = m[0].replace(/[:\-.]/g, '').toUpperCase();
    const name = line.replace(m[0], '').replace(/^[\s,;\t"']+|[\s,;\t"']+$/g, '').replace(/[\s,;\t"']{2,}/g, ' ') || '(?)';
    if (tok.endsWith('*')) {
      const core = tok.slice(0, 11);
      if (!/^[0-9A-F]{11}$/.test(core)) continue;
      out.push({ name, kind: 'bssid', core, disp: pairs(core + '*') });
    } else {
      if (tok.length !== 12) continue;
      out.push({ name, kind: 'mac', hex: tok, q: tok.includes('?'), disp: pairs(tok) });
    }
  }
  return out;
}
const entryKey = e => e.kind === 'bssid' ? 'B' + e.core : 'M' + e.hex.slice(0, 6) + (parseInt(e.hex.slice(6).replace('?', '0'), 16) & 0xFFFFF);
function loadList() { $('list').value = lsGet('apList', ''); aps = parseList($('list').value); }
function storeList() { lsSet('apList', $('list').value); aps = parseList($('list').value); renderTable(); syncNative(); }
function appendLines(lines) {
  const v = $('list').value.replace(/\s+$/, '');
  $('list').value = (v ? v + '\n' : '') + lines.join('\n');
  storeList();
}

/* Aruba: BSSID -> dolne 20 bitów MAC (wg bazy wiedzy Aruby) */
function arubaWant(h, band) {
  const known = ((parseInt(h.slice(6), 16) >> 4) ^ 0x80000) & 0xFFFFF;
  return band === '24' ? known : (known - 1) & 0xFFFFF;
}
function arubaMacTxt(h, band) { const w = hex(arubaWant(h, band), 5); return pairs(h.slice(0, 6)) + ':?' + w[0] + ':' + w.slice(1, 3) + ':' + w.slice(3); }

/* Rozpoznanie AP po BSSID */
function identify(h, band) {
  if (!h) return null;
  let e = null, mac = null;
  if (S.mode === 'aruba' && (band === '24' || band === '5')) {
    const want = arubaWant(h, band);
    mac = arubaMacTxt(h, band);
    e = aps.find(a => a.kind === 'mac' && a.hex.slice(0, 6) === h.slice(0, 6) && (parseInt(a.hex.slice(6).replace('?', '0'), 16) & 0xFFFFF) === want);
    if (e) mac = e.disp;
  }
  if (!e) e = aps.find(a => (a.kind === 'bssid' && h.startsWith(a.core)) || (a.kind === 'mac' && !a.q && a.hex === h));
  return { entry: e || null, name: e ? e.name : null, mac };
}

/* =========================================================
   NA ŻYWO
   ========================================================= */
let cur = null;           // ostatni odczyt połączenia
let st = { perm: true, location: true, wifi: true };
let lastBssid = null;
const roams = [];         // {time, name, band, h}
const samples = [];       // {t, r, h, name}
const rssiBuf = [];
let lowSince = 0;

function readStatus() { if (!A) return; try { st = JSON.parse(A.status()); } catch (e) {} }

function tick() {
  if (!A) return;
  let o = {};
  try { o = JSON.parse(A.info()); } catch (e) {}
  const h = norm(o.bssid);
  const valid = h && h !== '020000000000' && o.freq > 0;
  cur = valid ? Object.assign(o, { h, band: bandOf(o.freq) }) : null;

  if (cur) {
    if (h !== lastBssid) rssiBuf.length = 0;
    if (o.rssi > -127 && o.rssi < 0) { rssiBuf.push(o.rssi); if (rssiBuf.length > 5) rssiBuf.shift(); }
    const id = identify(h, cur.band);
    if (lastBssid && h !== lastBssid) {
      roams.unshift({ time: new Date().toTimeString().slice(0, 8), name: id.name, band: cur.band, h });
      roams.length = Math.min(roams.length, 15);
      if ((S.sound || S.vib) && !S.bg) try { A.roamAlert(!!S.sound, !!S.vib); } catch (e) {}
      renderHist();
    }
    lastBssid = h;
    samples.push({ t: Date.now(), r: o.rssi, h, name: id.name, band: cur.band });
    // ostrzeżenie o „zablokowanej” prędkości: dobry sygnał, a router wysyła wolno przez >10 s
    // próg zależny od pasma: na 2,4 GHz (20 MHz) normalne prędkości to 72–144 Mb/s, na 5/6 GHz kilkaset
    const lowLimit = cur.band === '24' ? 40 : 100;
    const maxL = Math.max(o.maxRx || 0, o.maxTx || 0);
    const low = o.rx > 0 && o.rssi >= -67 && (maxL > 0 ? (o.rx * 8 < maxL || (o.rx < lowLimit && maxL >= lowLimit * 3)) : o.rx < lowLimit);
    lowSince = low ? (lowSince || Date.now()) : 0;
  } else {
    lowSince = 0;
  }
  while (samples.length && samples[0].t < Date.now() - 300000) samples.shift();
  renderLive();
  if (tab === 'chart') drawChart();
}

function renderSticky() {
  const b = stickyInfo(), box = $('sticky');
  if (!box) return;
  box.innerHTML = b ? `<div class="alert bad"><b>${esc(t('stickyT'))}</b><br>${esc(t('stickyD', { n: b.name || pairs(b.h), l: b.l, d: b.l - cur.rssi }))} ${bandBadge(bandOf(b.f), true)}</div>` : '';
}
function renderStatus() {
  const box = $('status');
  if (!A) { box.innerHTML = `<div class="alert">${esc(t('browserOnly'))}</div>`; return; }
  let h = '';
  if (!st.perm) h += `<div class="alert bad">${esc(t('noPerm'))}<button class="acc" onclick="Android.askPermission()">${esc(t('grant'))}</button></div>`;
  else if (!st.location) h += `<div class="alert bad">${esc(t('noLoc'))}<button class="acc" onclick="Android.openLocationSettings()">${esc(t('locOn'))}</button></div>`;
  else if (!st.wifi) h += `<div class="alert bad">${esc(t('noWifi'))}<button class="acc" onclick="Android.openWifiSettings()">${esc(t('wifiSet'))}</button></div>`;
  else if (!cur) h += `<div class="alert">${esc(t('notConn'))}</div>`;
  box.innerHTML = h;
}

function scanFor(h) { return lastScan.find(r => norm(r.b) === h); }

function renderLive() {
  renderStatus(); renderSticky();
  const lc = $('liveCard'), sc = $('speedCard');
  if (!cur) { lc.style.display = sc.style.display = 'none'; return; }
  lc.style.display = sc.style.display = '';
  const o = cur, id = identify(o.h, o.band);
  const avg = rssiBuf.length ? rssiBuf.reduce((a, b) => a + b, 0) / rssiBuf.length : o.rssi;
  const dm = distM(avg, o.freq), dp = distParts(dm), dpos = distPos(dm);
  const p = pctOf(o.rssi), q = qual(p);
  const lv = sigLevel(p);
  const sr = scanFor(o.h);
  const widths = { 0: '20', 1: '40', 2: '80', 3: '160', 4: '80+80', 5: '320' };
  const w = sr && widths[sr.w] ? widths[sr.w] + ' MHz' : '';
  const ssid = String(o.ssid || '').replace(/^"|"$/g, '');

  lc.innerHTML = `

function stickyInfo() {
  if (!S.sticky || !cur || cur.rssi > -65) return null;
  const ssid = String(cur.ssid || '').replace(/^"|"$/g, ''), myName = identify(cur.h, cur.band).name;
  let best = null;
  for (const r of lastScan) {
    const x = norm(r.b);
    if (!x || r.s !== ssid || (r.age || 0) > 90) continue;
    if (x.slice(0, 11) === cur.h.slice(0, 11) || x.slice(2, 10) === cur.h.slice(2, 10)) continue;
    const xn = identify(x, bandOf(r.f)).name;
    if (myName && xn === myName) continue;
    if (!best || r.l > best.l) best = Object.assign({ name: xn, h: x }, r);
  }
  return best && best.l - cur.rssi >= 12 ? best : null;
}

}

let lastScan = [], lastScanAt = 0, throttled = false;

function maybeScan(force) {
  if (!A) return;

    throttled = !A.scan();

}
function renderNear() {

      <div class="dim">${id.name ? esc(r.s) + ' · ' : ''}<span class="mono">${pairs(h)}</span> · ${esc(t('chan'))} ${chanOf(r.f)}${isCur ? ` · <b class="ok">● ${esc(t('connected'))}</b>` : ''}</div>

let nm = null;
function openName(h, freq) {
  const band = bandOf(freq);
  const id = identify(h, band);
  nm = { h, band };
  $('nmName').value = id.name || '';
  const vendor = vendorOf(h);
  const arubaWay = S.mode === 'aruba' && (band === '24' || band === '5');
  $('nmInfo').innerHTML = `${bandBadge(band, true)} <span class="mono">${pairs(h)}</span><br>${esc(t('vendor'))}: ${esc(vendor)}` +
    (arubaWay ? `<br><span class="ok">${esc(t('arubaSaveInfo'))}</span>` : '');
  // inne BSSID-y tego samego urządzenia: bajty 2–5 adresu takie same (pomijamy bit adresu wirtualnego i ostatni bajt)
  let cands = '';
  if (!arubaWay) {
    const same = lastScan.filter(r => { const x = norm(r.b); return x && x.slice(0, 11) === h.slice(0, 11); });
    if (same.length) cands += `<div class="dim" style="margin-bottom:4px">${esc(t('coverTitle'))}</div>` + same.map(r =>
      `<div class="cand" style="opacity:.85"><span style="width:22px;text-align:center" class="ok">✓</span><span>${bandBadge(bandOf(r.f), true)} <span class="mono">${pairs(norm(r.b))}</span><br><span class="dim">${esc(r.s || t('hidden'))} · ${pctOf(r.l)}%</span></span></div>`).join('') + '<div style="height:10px"></div>';
    if (A && Date.now() - lastScanAt > 30000) maybeScan(true);
    const groups = new Map();
    for (const r of lastScan) {
      const x = norm(r.b);
      if (!x || x.slice(0, 11) === h.slice(0, 11)) continue;
      if (x.slice(2, 10) !== h.slice(2, 10)) continue;
      const core = x.slice(0, 11);
      const g = groups.get(core) || { core, items: [] };
      g.items.push(r); groups.set(core, g);
    }
    if (groups.size) {
      cands += `<div class="dim" style="margin-bottom:4px">${esc(t('candTitle'))}</div>` + [...groups.values()].map(g => {
        const named = aps.some(a => a.kind === 'bssid' && a.core === g.core);
        const bands = [...new Set(g.items.map(r => bandOf(r.f)))].map(b => bandBadge(b, true)).join(' ');
        const ss = [...new Set(g.items.map(r => r.s || '?'))].map(esc).join(', ');
        const best = Math.max(...g.items.map(r => r.l));
        return `<label class="cand"><input type="checkbox" data-core="${g.core}" ${named ? '' : 'checked'}>
          <span>${bands} <span class="mono">${pairs(g.core + '*')}</span><br><span class="dim">${ss} · ${pctOf(best)}% (${best} dBm)</span></span></label>`;
      }).join('');
    } else cands += `<div class="dim">${esc(t('candNone'))}</div>`;
  }
  $('nmCands').innerHTML = cands;
  $('nameModal').classList.add('on');
  setTimeout(() => $('nmName').focus(), 50);
}
function closeName() { $('nameModal').classList.remove('on'); nm = null; }
function saveName() {
  const n = $('nmName').value.trim();
  if (!n || !nm) { $('nmName').focus(); return; }
  const { h, band } = nm;
  const keep = aps.filter(a => {
    // usuń stare wpisy dla tych samych adresów (zmiana nazwy)
    if (S.mode === 'aruba' && (band === '24' || band === '5') && a.kind === 'mac') {
      const w = arubaWant(h, band);
      return !(a.hex.slice(0, 6) === h.slice(0, 6) && (parseInt(a.hex.slice(6).replace('?', '0'), 16) & 0xFFFFF) === w);
    }
    return true;
  });
  const lines = [];
  if (S.mode === 'aruba' && (band === '24' || band === '5')) {
    lines.push(n + '  ' + arubaMacTxt(h, band));
  } else {
    const cores = [h.slice(0, 11)];
    document.querySelectorAll('#nmCands input:checked').forEach(c => cores.push(c.dataset.core));
    for (const c of new Set(cores)) lines.push(n + '  ' + pairs(c + '*'));
  }
  // przebuduj listę: stare wpisy z tymi samymi rdzeniami zastępujemy
  const newCores = new Set(lines.map(l => parseList(l)[0]).filter(e => e.kind === 'bssid').map(e => e.core));
  const kept = $('list').value.split(/\r?\n/).filter(l => {
    const e = parseList(l)[0];
    if (!e) return l.trim() !== '';
    if (e.kind === 'bssid' && newCores.has(e.core)) return false;
    return keep.some(k => k.disp === e.disp && k.name === e.name) || e.kind === 'bssid';
  });
  $('list').value = kept.join('\n');
  appendLines(lines);
  closeName();
  renderAll();
}

const PALETTE = ['#3ddc84', '#3ea6ff', '#ffb020', '#b36bff', '#ff6b9a', '#4fe0d0', '#ff8a3d', '#c9e265'];
const apColors = new Map();
function colorFor(key) { if (!apColors.has(key)) apColors.set(key, PALETTE[apColors.size % PALETTE.length]); return apColors.get(key); }
function drawChart() {
  const c = $('chart'); if (!c) return;
  const dpr = window.devicePixelRatio || 1, W = c.clientWidth || 360, H = 260;
  c.width = W * dpr; c.height = H * dpr; c.style.height = H + 'px';
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  const L = 40, R = 40, T = 10, B = 22, now = Date.now(), span = 300000;
  const x = tm => L + (W - L - R) * (1 - (now - tm) / span), y = r => T + (H - T - B) * (-30 - clamp(r, -100, -30)) / 70;
  g.font = '11px system-ui'; g.lineWidth = 1;
  for (let r = -30; r >= -100; r -= 10) {
    g.strokeStyle = '#2b323b'; g.beginPath(); g.moveTo(L, y(r)); g.lineTo(W - R, y(r)); g.stroke();
    g.fillStyle = '#8b95a1'; g.textAlign = 'right'; g.fillText(r, L - 6, y(r) + 4);
    if (r <= -50) { g.textAlign = 'left'; g.fillText(pctOf(r) + '%', W - R + 6, y(r) + 4); }
  }
  g.textAlign = 'center';
  for (let m = 0; m <= 5; m++) g.fillText(m === 0 ? (S.lang === 'pl' ? 'teraz' : 'now') : '-' + m + ' min', x(now - m * 60000), H - 6);
  const legend = new Map();
  for (let i = 1; i < samples.length; i++) {
    const a = samples[i - 1], b = samples[i];
    if (b.t - a.t > 5000) continue;
    const key = b.name || pairs(b.h);
    const col = colorFor(key); legend.set(key, { col, band: b.band });
    g.strokeStyle = col; g.lineWidth = 2.5; g.beginPath(); g.moveTo(x(a.t), y(a.r)); g.lineTo(x(b.t), y(b.r)); g.stroke();
    if (a.h !== b.h) {
      g.save(); g.setLineDash([4, 4]); g.strokeStyle = '#e8ecf0'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(x(b.t), T); g.lineTo(x(b.t), H - B); g.stroke(); g.restore();
    }
  }
  if (samples.length === 1) { const s = samples[0], key = s.name || pairs(s.h); legend.set(key, { col: colorFor(key), band: s.band }); }
  $('legend').innerHTML = [...legend.entries()].map(([k, v]) => `<span><i style="background:${v.col}"></i>${esc(k)} ${bandBadge(v.band, true)}</span>`).join('');
}

function netsTxt(n) {
  if (S.lang === 'en') return n + (n === 1 ? ' network' : ' networks');
  const d = n % 10, dd = n % 100;
  return n + (n === 1 ? ' sieć' : d >= 2 && d <= 4 && !(dd >= 12 && dd <= 14) ? ' sieci' : ' sieci');
}
function renderChannels() {
  const box = $('channels'); if (!box) return;
  if (!A) { box.innerHTML = `<div class="dim">${esc(t('browserOnly'))}</div>`; return; }
  if (!lastScan.length) { box.innerHTML = `<div class="dim">${esc(t('nearEmpty'))}</div>`; return; }
  const bands = { '24': new Map(), '5': new Map(), '6': new Map() };
  for (const r of lastScan) {
    const b = bandOf(r.f); if (!b) continue;
    const c = chanOf(r.f), m = bands[b];
    const e = m.get(c) || { n: 0, best: -127 };
    e.n++; e.best = Math.max(e.best, r.l); m.set(c, e);
  }
  const myB = cur && cur.band, myC = cur && chanOf(cur.freq);
  let html = '';
  for (const b of ['24', '5', '6']) {
    const m = bands[b]; if (!m.size) continue;
    const max = Math.max(...[...m.values()].map(e => e.n));
    const col = b === '24' ? 'var(--b24)' : b === '5' ? 'var(--b5)' : 'var(--b6)';
    html += `<div class="chb">${bandBadge(b, true)}</div>` + [...m.entries()].sort((x, y) => x[0] - y[0]).map(([c, e]) => {
      const me = b === myB && c === myC;
      return `<div class="chr ${me ? 'me' : ''}"><span class="c">${esc(t('chan'))} ${c}</span><span class="bx"><i style="width:${Math.max(6, e.n / max * 100)}%;background:${col}"></i></span>
        <span class="v">${esc(netsTxt(e.n))} · ${e.best} dBm${me ? ' · ●' : ''}</span></div>`;
    }).join('');
  }
  box.innerHTML = html + `<div class="dim" style="margin-top:8px">${esc(t('chNote'))}</div>`;
}

function renderCalc() {
  const raw = $('calcIn').value.trim(), out = $('calcOut');
  if (!raw) { out.innerHTML = `<div class="dim">${esc(t('calcEmpty'))}</div>`; return; }
  const hx = raw.split(/[\s:\-._,;\/|]+/).filter(s => /^[0-9a-f]+$/i.test(s)).join('').toUpperCase();
  if (hx.length < 6) { out.innerHTML = `<div class="warn">${esc(t('calcShort'))}</div>`; return; }
  let h = hx.length >= 12 ? hx.slice(-12) : null;
  // tylko końcówka: dopasuj do listy po ostatnich bajtach
  if (!h) {
    const tail = hx.slice(-6);
    const pre = aps.find(a => a.kind === 'mac') ? aps.find(a => a.kind === 'mac').hex.slice(0, 6) : '000000';
    h = pre + tail;
  }
  let html = '';
  const found = [];
  for (const b of ['24', '5']) {
    const id = identify(h, b);
    if (id.name && !found.some(f => f.name === id.name)) found.push({ name: id.name, band: b, mac: id.mac });
  }
  if (found.length) html += found.map(f => `<div class="name">${esc(f.name)}</div>` + (S.mode === 'aruba' && f.mac ? `<div class="dim">${esc(t('arubaMac'))}: <b class="mono">${esc(f.mac)}</b> · ${bandBadge(f.band, true)}</div>` : '')).join('');
  else html += `<div class="dim">${esc(t('calcNoMatch'))}</div>`;
  if (hx.length >= 12) html += `<div class="dim" style="margin-top:6px">${esc(t('vendor'))}: ${esc(vendorOf(h))}</div>`;
  if (S.mode === 'aruba' && !found.length) {
    html += `<div class="dim" style="margin-top:8px">${esc(t('calcIf24'))}</div><div class="mono" style="font:700 20px ui-monospace">${esc(arubaMacTxt(h, '24'))}</div>
             <div class="dim">${esc(t('calcIf5'))}</div><div class="mono" style="font:700 20px ui-monospace">${esc(arubaMacTxt(h, '5'))}</div>`;
  }
  out.innerHTML = html;
}

function importTxt(text) {
  if (text === null || text === undefined) { msg(`<span class="warn">${esc(t('importErr'))}</span>`); return; }
  const have = new Set(aps.map(entryKey));
  const incoming = parseList(String(text));
  if (!incoming.length) { msg(`<span class="warn">${esc(t('importNone'))}</span>`); return; }
  const add = []; let skipped = 0;
  for (const a of incoming) {
    const k = entryKey(a);
    if (have.has(k)) { skipped++; continue; }
    have.add(k); add.push(a.name + '  ' + a.disp);
  }
  if (add.length) { appendLines(add); renderAll(); }
  msg(`<span class="ok">${esc(add.length === 1 ? t('added1') : t('added', { n: add.length }))}</span>` + (skipped ? esc(t('skipped', { n: skipped })) : '') + '.');
}

window.onAppResume = () => {
  readStatus(); tick(); if (S.screen && A) A.keepScreenOn(true);
  if (A && A.isMonitoring) { const on = !!A.isMonitoring(); if (on !== S.bg) { S.bg = on; $('optBg').checked = on; lsSet('apidSettings', JSON.stringify(S)); } }
};

loadList();
applyI18n();
showTab(tab);
if (A) {
  readStatus(); readScan(); syncNative(); tick();
  if (S.screen) A.keepScreenOn(true);
  if (S.bg && A.setMonitoring) A.setMonitoring(true);
  setInterval(tick, 1000);
  setInterval(readStatus, 5000);
  setInterval(() => { if (tab === 'near' || (S.sticky && tab === 'live')) maybeScan(false); else readScan(); if (tab === 'chart') renderChannels(); }, 5000);
}
</script>
